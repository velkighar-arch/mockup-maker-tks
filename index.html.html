<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup Maker</title>
<style>
body{font-family:Arial,sans-serif;background:#f4efe6;margin:0;padding:20px;color:#333}
.box{max-width:960px;margin:auto}
.panel{background:#fff;border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 2px 8px #0001}
label{display:block;font-weight:bold;margin:12px 0 4px}
input[type=text],input[type=number]{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{background:#2b8be0;color:#fff;border:0;padding:12px 22px;border-radius:8px;font-size:16px;cursor:pointer;margin-top:14px}
button.dl{background:#2a9d4a;margin-top:8px}
canvas{width:100%;border-radius:8px;border:1px solid #ddd;display:block}
small{color:#777}
</style></head><body><div class="box">
<h2>📚 মকআপ মেকার</h2>
<div class="panel">
<label>বইয়ের টাইটেল (২য় মকআপে উপরে বসবে)</label>
<input type="text" id="title" value="Kids Calendar Learning Guide">
<label>বুক কভার (১টি ছবি)</label><input type="file" id="cover" accept="image/*">
<label>ভেতরের পেজ (সর্বোচ্চ ৮টি, একসাথে সিলেক্ট করুন)</label>
<input type="file" id="pages" accept="image/*" multiple>
<small>ফাইলের নাম অনুযায়ী (01, 02, 03…) সাজানো হবে।</small>
<label>মোট পেজ সংখ্যা (৩য় মকআপের ব্যাজে)</label>
<input type="number" id="count" value="31">
<label>ব্যাকগ্রাউন্ড রং</label><input type="color" id="bg" value="#fbf6ec">
<button onclick="gen()">মকআপ তৈরি করুন</button>
</div>
<div id="out"></div>
</div>
<script>
const W=1740,H=1160;
const $=id=>document.getElementById(id);
const load=f=>new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('ফাইল পড়া যায়নি: '+f.name));
fr.onload=()=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('ছবি খোলা যায়নি: '+f.name));i.src=fr.result};fr.readAsDataURL(f)});
function rr(x,a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}
function draw(x,img,cx,cy,h,rot=0){
  const w=h*img.width/img.height;
  x.save();x.translate(cx,cy);x.rotate(rot*Math.PI/180);
  x.shadowColor='rgba(0,0,0,.28)';x.shadowBlur=22;x.shadowOffsetY=6;
  x.drawImage(img,-w/2,-h/2,w,h);x.restore();
}
function icon(x,t,cx,cy,s){
  x.save();x.translate(cx,cy);x.textAlign='center';x.font='bold '+s*.2+'px Arial';
  if(t=='pdf'||t=='jpg'){
    x.fillStyle='#fff';x.strokeStyle='#222';x.lineWidth=3;rr(x,-s*.4,-s*.5,s*.8,s,8);x.fill();x.stroke();
    x.fillStyle=t=='pdf'?'#e03a2f':'#f5b400';rr(x,-s*.4,s*.12,s*.8,s*.32,6);x.fill();
    x.fillStyle=t=='pdf'?'#fff':'#222';x.fillText(t.toUpperCase(),0,s*.36);
    if(t=='jpg'){x.fillStyle='#3cc0a0';x.fillRect(-s*.32,-s*.38,s*.64,s*.46)}
    else{x.strokeStyle='#e03a2f';x.lineWidth=5;x.beginPath();x.arc(0,-s*.12,s*.18,0,7);x.stroke()}
  }else if(t=='dl'){
    x.fillStyle='#1f6fd0';rr(x,-s*.5,-s*.5,s,s,14);x.fill();
    x.fillStyle='#fff';x.beginPath();x.moveTo(-s*.14,-s*.3);x.lineTo(s*.14,-s*.3);x.lineTo(s*.14,-s*.08);x.lineTo(s*.26,-s*.08);x.lineTo(0,s*.18);x.lineTo(-s*.26,-s*.08);x.lineTo(-s*.14,-s*.08);x.fill();
    x.font='bold '+s*.13+'px Arial';x.fillText('DOWNLOAD',0,s*.4);
  }else{
    x.fillStyle='#e8433a';x.beginPath();x.arc(0,0,s*.5,0,7);x.fill();
    x.fillStyle='#fff';rr(x,-s*.25,-s*.1,s*.5,s*.26,4);x.fill();rr(x,-s*.15,-s*.3,s*.3,s*.2,3);x.fill();rr(x,-s*.15,s*.08,s*.3,s*.24,3);x.fill();
  }
  x.restore();
}
function canvas(){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle=$('bg').value;x.fillRect(0,0,W,H);return[c,x]}

function m1(cover,pg){
  const[c,x]=canvas();const all=[cover,...pg].slice(0,8);
  all.forEach((im,i)=>draw(x,im,44+(i%4)*386+171,43+257+Math.floor(i/4)*557,515));
  [['pdf',125],['jpg',440],['dl',750],['pr',1070]].forEach(([t,y])=>icon(x,t,1645,y,95));
  return c;
}
function m2(cover,pg,title){
  const[c,x]=canvas();
  const L=[[235,420,-28],[310,620,-20],[250,830,-24],[390,950,-17]];
  const R=[[1505,420,28],[1430,620,20],[1490,830,24],[1350,950,17]];
  pg.slice(0,4).forEach((im,i)=>draw(x,im,...L[i].slice(0,2),500,L[i][2]));
  pg.slice(4,8).forEach((im,i)=>draw(x,im,...R[i].slice(0,2),500,R[i][2]));
  draw(x,cover,870,637,955);
  x.fillStyle='#111';x.textAlign='center';x.font='bold 74px "Arial Black",Arial';
  let s=74;while(x.measureText(title).width>1250&&s>30){s-=2;x.font='bold '+s+'px "Arial Black",Arial'}
  x.fillText(title,870,115);
  icon(x,'pdf',80,85,95);icon(x,'jpg',1660,85,95);
  return c;
}
function m3(cover,pg,n){
  const[c,x]=canvas();
  if(pg[0])draw(x,pg[0],900,570,900,-22);
  draw(x,cover,430,590,900,-22);
  [['pdf',117],['jpg',300],['dl',440],['pr',580]].forEach(([t,y])=>icon(x,t,1505,y,95));
  const g=x.createRadialGradient(1450,860,20,1495,915,165);g.addColorStop(0,'#ffcf3d');g.addColorStop(1,'#f5a800');
  x.fillStyle=g;x.strokeStyle='#d9923a';x.lineWidth=6;x.beginPath();x.arc(1495,915,158,0,7);x.fill();x.stroke();
  x.fillStyle='#111';x.textAlign='center';x.font='bold 150px Arial';x.fillText($('count').value,1495,945);
  x.font='bold 60px Arial';x.fillText('Pages',1495,1015);
  return c;
}
async function gen(){
  const out=$('out');out.innerHTML='<div class="panel">⏳ তৈরি হচ্ছে...</div>';
  try{await run()}catch(e){out.innerHTML='<div class="panel" style="color:#c00">সমস্যা: '+e.message+'</div>'}
}
async function run(){
  const out=$('out');
  const cf=$('cover').files[0];if(!cf)throw new Error('আগে বুক কভার ছবি দিন');
  const pf=[...$('pages').files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})).slice(0,8);
  const cover=await load(cf);const pg=await Promise.all(pf.map(load));
  const t=$('title').value;
  const list=[['mockup-1',m1(cover,pg)],['mockup-2',m2(cover,pg,t)],['mockup-3',m3(cover,pg,0)]];
  out.innerHTML='';
  list.forEach(([n,c])=>{
    const d=document.createElement('div');d.className='panel';d.appendChild(c);
    const b=document.createElement('button');b.className='dl';b.textContent='⬇ '+n+'.jpg ডাউনলোড';
    b.onclick=()=>{const a=document.createElement('a');a.href=c.toDataURL('image/jpeg',.95);a.download=n+'.jpg';document.body.appendChild(a);a.click();a.remove()};
    d.appendChild(b);out.appendChild(d);
  });
}
</script></body></html>
